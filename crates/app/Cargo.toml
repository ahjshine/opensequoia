[package]
name = "opensequoia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenSequoia Windows browser development increment"

[dependencies]
opensequoia-engine = { path = "../engine" }
opensequoia-ipc = { path = "../ipc" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization"] }
